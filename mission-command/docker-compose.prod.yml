# Mission Command Centre - Production Docker Compose

version: '3.8'

services:
  # Mission Command UI
  mission-command-ui:
    build:
      context: ..
      dockerfile: mission-command/Dockerfile
      target: ui-production
    container_name: mission-command-ui-prod
    ports:
      - "3000:3000"
    environment:
      - VITE_MASTRA_API_URL=https://${DOMAIN:-api.missioncommand.com}
      - NODE_ENV=production
    depends_on:
      - mastra-server
    restart: always
    networks:
      - mission-command

  # Mastra Server
  mastra-server:
    build:
      context: ..
      dockerfile: mission-command/Dockerfile
      target: server
    container_name: mastra-server-prod
    ports:
      - "4111:4111"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - JWT_AUTH_SECRET=${JWT_AUTH_SECRET}
      - FRONTEND_URL=https://${DOMAIN:-missioncommand.com}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - DEFAULT_ROLE=${DEFAULT_ROLE:-viewer}
    volumes:
      - mission-command-data:/data
    restart: always
    networks:
      - mission-command

  # PostgreSQL for production
  postgres:
    image: postgres:15-alpine
    container_name: mission-command-db-prod
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-mission_command}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: always
    networks:
      - mission-command

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: mission-command-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      - mission-command-ui
      - mastra-server
    restart: always
    networks:
      - mission-command

volumes:
  mission-command-data:
    driver: local
  postgres-data:
    driver: local
  nginx-logs:
    driver: local

networks:
  mission-command:
    driver: bridge
