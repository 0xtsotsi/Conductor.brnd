# Mission Command Centre - Docker Compose

version: '3.8'

services:
  # Mission Command UI
  mission-command-ui:
    build:
      context: ..
      dockerfile: mission-command/Dockerfile
      target: ui-production
    container_name: mission-command-ui
    ports:
      - "3000:3000"
    environment:
      - VITE_MASTRA_API_URL=http://mastra-server:4111
      - NODE_ENV=production
    depends_on:
      - mastra-server
    restart: unless-stopped
    networks:
      - mission-command

  # Mastra Server
  mastra-server:
    build:
      context: ..
      dockerfile: mission-command/Dockerfile
      target: server
    container_name: mastra-server
    ports:
      - "4111:4111"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/data/mission-command.db
      - LIBSQL_URL=file:/data/mission-command.db
      - JWT_AUTH_SECRET=${JWT_AUTH_SECRET}
      - FRONTEND_URL=http://localhost:3000
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - DEFAULT_ROLE=${DEFAULT_ROLE:-viewer}
    volumes:
      - mission-command-data:/data
    restart: unless-stopped
    networks:
      - mission-command

  # Optional: PostgreSQL for production
  # Uncomment to use PostgreSQL instead of LibSQL
  # postgres:
  #   image: postgres:15-alpine
  #   container_name: mission-command-db
  #   environment:
  #     - POSTGRES_USER=${POSTGRES_USER:-mission_command}
  #     - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
  #     - POSTGRES_DB=${POSTGRES_DB:-mission_command}
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"
  #   restart: unless-stopped
  #   networks:
  #     - mission-command

  # Optional: Nginx reverse proxy
  # Uncomment for production deployment
  # nginx:
  #   image: nginx:alpine
  #   container_name: mission-command-nginx
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - mission-command-ui
  #     - mastra-server
  #   restart: unless-stopped
  #   networks:
  #     - mission-command

volumes:
  mission-command-data:
    driver: local
  # postgres-data:
  #   driver: local

networks:
  mission-command:
    driver: bridge
